resources:
  jobs:
    earthquake_end_to_end_job:
      name: earthquake_end_to_end_job
      tasks:
        - task_key: ingestion_to_bronze
          notebook_task:
            notebook_path: ../src/notebooks/ingestion_to_bronze.ipynb
            base_parameters:
              catalog_name: saiakhila_dev
            source: WORKSPACE
        - task_key: bronze_to_silver
          depends_on:
            - task_key: ingestion_to_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_to_silver.id}
            full_refresh: false
        - task_key: earthquake_Dashboard
          depends_on:
            - task_key: bronze_to_silver
          dashboard_task:
            subscription: {}
            warehouse_id: f4bbf6c0e0cbec60
            dashboard_id: 01f143b84df314f6bf8a3fabd5782add
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
