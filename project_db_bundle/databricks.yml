# This is a Databricks asset bundle definition for project_db_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_db_bundle
  uuid: fa1b5fce-9f22-4762-b012-92e3659d3112

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    id: "f4bbf6c0e0cbec60"  # Define as a map with an id key
    

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6ebe8411-e018.cloud.databricks.com
    variables:
      catalog: saiakhila_dev
      schema: dev
      warehouse_id: "f4bbf6c0e0cbec60"
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-6ebe8411-e018.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/saiakhilasoora5@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/saiakhilasoora5@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: saiakhila_prod
      schema: prod
      warehouse_id: "f4bbf6c0e0cbec60"
    permissions:
      - user_name: saiakhilasoora5@gmail.com
        level: CAN_MANAGE
